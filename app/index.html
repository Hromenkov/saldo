<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сальдо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap">
<style>
/* Material 3 tokens, Google Workspace flavour */
:root {
  --md-primary: #0B57D0;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #D3E3FD;
  --md-on-primary-container: #041E49;
  --md-secondary-container: #C2E7FF;
  --md-on-secondary-container: #001D35;
  --md-tertiary-container: #FFE08A;
  --md-on-tertiary-container: #3D2E00;
  --md-success-container: #C4EED0;
  --md-on-success-container: #0A3818;
  --md-error: #B3261E;
  --md-error-container: #F9DEDC;
  --md-on-error-container: #410E0B;
  --md-surface: #F8FAFD;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low: #F0F4F9;
  --md-surface-container: #E9EEF6;
  --md-surface-container-high: #E3E8EE;
  --md-on-surface: #1F1F1F;
  --md-on-surface-variant: #444746;
  --md-outline: #747775;
  --md-outline-variant: #C4C7C5;
  --md-inverse-surface: #303030;
  --md-inverse-on-surface: #F2F2F2;
  --md-inverse-primary: #A8C7FA;
  --md-scrim: rgba(0,0,0,.32);
  --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
  --elev-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
  --elev-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--md-surface); color: var(--md-on-surface);
  font-family: var(--font); font-size: 14px; line-height: 20px; letter-spacing: .1px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.ms {
  font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased;
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; user-select: none;
}
.ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.ms.sm { font-size: 18px; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

/* typescale */
.display-s { font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: -.5px; }
.headline-m { font-size: 28px; line-height: 36px; font-weight: 400; letter-spacing: -.3px; }
.headline-s { font-size: 24px; line-height: 32px; font-weight: 400; letter-spacing: -.2px; }
.title-l { font-size: 22px; line-height: 28px; font-weight: 400; }
.title-m { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; }
.title-s { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }
.body-m { font-size: 14px; line-height: 20px; }
.body-s { font-size: 12px; line-height: 16px; letter-spacing: .4px; }
.label-m { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px; }
.muted { color: var(--md-on-surface-variant); }

/* state layer */
.sl { position: relative; overflow: hidden; isolation: isolate; }
.sl::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; z-index: -1; pointer-events: none; }
.sl:hover::before { opacity: .08; }
.sl:active::before { opacity: .12; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 24px; border-radius: 20px; border: 0; cursor: pointer;
  font-weight: 500; font-size: 14px; letter-spacing: .1px; white-space: nowrap; background: transparent;
}
.btn .ms { font-size: 18px; margin-left: -8px; }
.btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
.btn-filled:hover { box-shadow: var(--elev-1); }
.btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.btn-outlined { border: 1px solid var(--md-outline); color: var(--md-primary); }
.btn-text { color: var(--md-primary); padding: 0 12px; }
.btn-text .ms { margin-left: -4px; }
.btn:disabled { background: rgba(31,31,31,.12); color: rgba(31,31,31,.38); box-shadow: none; cursor: default; border-color: transparent; }
.btn:disabled::before { display: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  display: inline-grid; place-items: center; color: var(--md-on-surface-variant); flex: none;
}
.fab {
  display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px 0 16px;
  border-radius: 16px; border: 0; cursor: pointer; background: var(--md-surface-container-lowest);
  color: var(--md-on-surface); box-shadow: var(--elev-1); font-weight: 500; font-size: 14px;
}
.fab:hover { box-shadow: var(--elev-2); }

/* app shell */
.app { display: grid; grid-template-rows: 64px 1fr; height: 100%; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; min-width: 216px; font-size: 22px; font-weight: 600; letter-spacing: -.6px; color: var(--md-on-surface-variant); }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--md-primary); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700; letter-spacing: 0; }
.brand b { color: var(--md-on-surface); font-weight: 600; }
.search {
  flex: 1; max-width: 720px; height: 48px; border-radius: 24px; background: var(--md-surface-container-high);
  display: flex; align-items: center; gap: 4px; padding: 0 4px; transition: background .15s, box-shadow .15s;
}
.search:focus-within { background: var(--md-surface-container-lowest); box-shadow: var(--elev-1); }
.search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; min-width: 0; }
.search input::placeholder { color: var(--md-on-surface-variant); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #1E8E3E; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; margin-left: 8px; }

.segmented { display: inline-flex; border: 1px solid var(--md-outline); border-radius: 20px; overflow: hidden; height: 40px; }
.segmented button { border: 0; background: transparent; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.segmented button + button { border-left: 1px solid var(--md-outline); }
.segmented button[aria-pressed="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.segmented button .ms { font-size: 18px; }
.segmented button[aria-pressed="false"] .ms { display: none; }

.segmented.block { display: flex; width: 100%; margin: 0 0 12px; }
.segmented.block button { flex: 1; justify-content: center; padding: 0 8px; }
.menu-anchor { position: relative; }
.menu { position: absolute; right: 0; top: 44px; z-index: 15; min-width: 220px; padding: 8px 0; border-radius: 4px; background: var(--md-surface-container); box-shadow: var(--elev-2); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 16px 0 12px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 14px; }
.menu button .ms { width: 24px; font-size: 20px; color: var(--md-on-surface-variant); }
.menu button[aria-checked="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.body { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 0; }
.drawer { padding: 8px 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.drawer .fab { align-self: flex-start; margin: 4px 0 16px 4px; }
.company {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 28px; margin-bottom: 8px;
  border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%;
}
.company .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--md-primary-container); color: var(--md-on-primary-container); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.company .t { flex: 1; min-width: 0; }
.company .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px 0 16px; border-radius: 24px;
  border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; color: var(--md-on-surface-variant); font-weight: 500;
}
.nav-item .ms { color: var(--md-on-surface-variant); }
.nav-item .badge { margin-left: auto; font-size: 12px; font-weight: 600; }
.nav-item[aria-current="page"] { background: var(--md-primary-container); color: var(--md-on-primary-container); font-weight: 600; }
.nav-item[aria-current="page"] .ms { color: var(--md-on-primary-container); font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.nav-label { padding: 18px 16px 8px; }
.drawer-foot { margin-top: auto; padding: 16px; }
.storage { height: 4px; border-radius: 2px; background: var(--md-surface-container-high); overflow: hidden; margin: 8px 0; }
.storage span { display: block; height: 100%; width: 62%; background: var(--md-primary); }

.main {
  background: var(--md-surface-container-lowest); border-radius: 16px 16px 0 0; margin-right: 16px;
  overflow-y: auto; min-width: 0;
}
.page { padding: 20px 24px 96px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; min-height: 48px; }
.page-head h1 { margin: 0; }
.page-head .spacer { flex: 1; }

/* cards */
.card { border-radius: 12px; padding: 16px; }
.card-filled { background: var(--md-surface-container-low); }
.card-outlined { border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-lowest); }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.stat { display: flex; flex-direction: column; gap: 8px; }
.stat .top { display: flex; align-items: center; gap: 8px; color: var(--md-on-surface-variant); }
.stat .top .ms { font-size: 20px; }
.stat .v { font-size: 28px; line-height: 36px; font-weight: 400; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.stat .d { color: var(--md-on-surface-variant); }
.up { color: #146C2E; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 28px 0 8px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.li { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 16px; border-radius: 0; cursor: default; }
.li + .li { border-top: 1px solid var(--md-outline-variant); }
.li .lead { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--md-surface-container-high); color: var(--md-on-surface-variant); }
.li .lead.blue { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.li .lead.yellow { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.li .lead.green { background: var(--md-success-container); color: var(--md-on-success-container); }
.li .lead.red { background: var(--md-error-container); color: var(--md-on-error-container); }
.li .txt { flex: 1; min-width: 0; }
.li .txt .s { color: var(--md-on-surface-variant); }
.li .trail { display: flex; align-items: center; gap: 8px; flex: none; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--md-outline); background: transparent; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap;
  color: var(--md-on-surface-variant);
}
.chip .ms { font-size: 18px; margin-left: -8px; }
.chip[aria-pressed="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
.status .ms { font-size: 16px; }
.st-ok { background: var(--md-success-container); color: var(--md-on-success-container); }
.st-check { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.st-new { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.st-err { background: var(--md-error-container); color: var(--md-on-error-container); }
.st-mute { background: var(--md-surface-container-high); color: var(--md-on-surface-variant); }

/* data table */
.table-wrap { overflow-x: auto; border: 1px solid var(--md-outline-variant); border-radius: 12px; }
table.dt { width: 100%; border-collapse: collapse; min-width: 720px; }
.dt th { text-align: left; font-weight: 500; color: var(--md-on-surface-variant); font-size: 12px; letter-spacing: .4px; padding: 12px 16px; border-bottom: 1px solid var(--md-outline-variant); white-space: nowrap; background: var(--md-surface-container-lowest); position: sticky; top: 0; }
.dt td { padding: 12px 16px; border-bottom: 1px solid var(--md-outline-variant); vertical-align: middle; }
.dt tr:last-child td { border-bottom: 0; }
.dt tbody tr { cursor: pointer; }
.dt tbody tr:hover td { background: var(--md-surface-container-low); }
.dt .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dt .acc { font-variant-numeric: tabular-nums; color: var(--md-on-surface-variant); white-space: nowrap; }
.dt .doc { display: flex; align-items: center; gap: 12px; }
.dt .doc .ms { color: var(--md-primary); }
.dt.compact { min-width: 520px; }
.dt.compact td { padding: 8px 12px; }
.dt.compact th { padding: 10px 12px; }
.g2eq { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1200px) { .g2eq { grid-template-columns: minmax(0, 1fr); } }
.dt tfoot td { font-weight: 600; border-top: 1px solid var(--md-outline-variant); border-bottom: 0; }
.neg { color: var(--md-on-surface); }
.pos { color: #146C2E; }

/* text fields (outlined) */
.tf { position: relative; }
.tf input, .tf select, .tf textarea {
  width: 100%; height: 56px; padding: 16px; border: 1px solid var(--md-outline); border-radius: 4px; background: transparent; outline: none; font-size: 16px;
}
.tf select { appearance: none; padding-right: 44px; }
.tf textarea { height: 96px; resize: vertical; }
.tf label {
  position: absolute; left: 12px; top: 18px; padding: 0 4px; background: var(--tf-bg, var(--md-surface-container-lowest)); color: var(--md-on-surface-variant);
  font-size: 16px; line-height: 20px; transition: transform .15s, font-size .15s, color .15s, top .15s; pointer-events: none;
}
.tf input:focus, .tf select:focus, .tf textarea:focus { border: 2px solid var(--md-primary); padding: 15px; }
.tf input:focus + label, .tf input:not(:placeholder-shown) + label,
.tf select + label, .tf textarea:focus + label, .tf textarea:not(:placeholder-shown) + label { top: -9px; font-size: 12px; line-height: 16px; }
.tf input:focus + label, .tf select:focus + label, .tf textarea:focus + label { color: var(--md-primary); }
.tf .trail-ic { position: absolute; right: 12px; top: 16px; color: var(--md-on-surface-variant); pointer-events: none; }
.tf .support { font-size: 12px; line-height: 16px; color: var(--md-on-surface-variant); padding: 4px 16px 0; }
.tf.warn input { border-color: #8A6100; }
.tf.warn .support { color: #8A6100; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
.form-grid .full { grid-column: 1 / -1; }

/* side sheet */
.scrim { position: fixed; inset: 0; background: var(--md-scrim); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--md-surface-container-low);
  border-radius: 16px 0 0 16px; z-index: 21; transform: translateX(105%); transition: transform .25s cubic-bezier(.2,0,0,1);
  display: flex; flex-direction: column; --tf-bg: var(--md-surface-container-low);
}
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px 24px; }
.sheet-head h2 { margin: 0; flex: 1; }
.sheet-body { padding: 8px 24px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--md-outline-variant); }
.preview { border-radius: 12px; background: var(--md-surface-container-lowest); border: 1px solid var(--md-outline-variant); padding: 16px; font-size: 12px; line-height: 18px; }
.preview .pl { height: 6px; border-radius: 3px; background: var(--md-surface-container-high); margin: 6px 0; }
.posting { border-radius: 12px; background: var(--md-surface-container-lowest); border: 1px solid var(--md-outline-variant); overflow: hidden; }
.posting table { width: 100%; border-collapse: collapse; }
.posting th, .posting td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--md-outline-variant); font-variant-numeric: tabular-nums; }
.posting th { font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); }
.posting tr:last-child td { border-bottom: 0; }
.posting td.r, .posting th.r { text-align: right; }
.conf { display: flex; align-items: center; gap: 8px; color: var(--md-on-surface-variant); }
.conf .bar { flex: 1; height: 4px; background: var(--md-surface-container-high); border-radius: 2px; overflow: hidden; }
.conf .bar span { display: block; height: 100%; background: var(--md-primary); }

/* dialog */
.dialog-wrap { position: fixed; inset: 0; display: grid; place-items: center; z-index: 31; pointer-events: none; padding: 24px; }
.dialog {
  width: min(560px, 100%); background: var(--md-surface-container-high); border-radius: 28px; padding: 24px;
  box-shadow: var(--elev-3); display: flex; flex-direction: column; gap: 16px; transform: scale(.95); opacity: 0;
  transition: transform .2s cubic-bezier(.2,0,0,1), opacity .2s; pointer-events: none; --tf-bg: var(--md-surface-container-high);
}
.dialog.open { transform: none; opacity: 1; pointer-events: auto; }
.dialog .d-ic { color: var(--md-primary); align-self: center; }
.dialog h2 { margin: 0; text-align: center; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.dialog .tf input, .dialog .tf select { background: transparent; }
#dlgScrim { z-index: 30; }

/* snackbar */
.snack {
  position: fixed; left: 24px; bottom: 24px; z-index: 40; min-height: 48px; max-width: 560px; padding: 4px 8px 4px 16px;
  background: var(--md-inverse-surface); color: var(--md-inverse-on-surface); border-radius: 4px; box-shadow: var(--elev-3);
  display: flex; align-items: center; gap: 12px; transform: translateY(150%); transition: transform .25s cubic-bezier(.2,0,0,1);
}
.snack.open { transform: none; }
.snack .btn-text { color: var(--md-inverse-primary); }

/* misc */
.chart { width: 100%; height: 220px; display: block; }
.chart .grid-l { stroke: var(--md-outline-variant); stroke-width: 1; }
.chart .axis { fill: var(--md-on-surface-variant); font-size: 11px; font-family: var(--font); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--md-outline-variant); margin-bottom: 16px; overflow-x: auto; }
.tab { height: 48px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-weight: 500; color: var(--md-on-surface-variant); position: relative; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--md-primary); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--md-primary); }
.q-card { display: flex; flex-direction: column; gap: 12px; }
.q-head { display: flex; gap: 16px; align-items: flex-start; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--md-on-surface-variant); }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 16px; align-items: center; padding: 14px 16px; }
.steps li + li { border-top: 1px solid var(--md-outline-variant); }
.steps .chk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--md-outline); }
.steps .done .chk { background: var(--md-primary); border-color: var(--md-primary); color: #fff; }
.steps .done .chk .ms { font-size: 16px; }
.steps .txt { flex: 1; min-width: 0; }
.progress-l { height: 4px; border-radius: 2px; background: var(--md-primary-container); overflow: hidden; margin: 12px 0 4px; }
.progress-l span { display: block; height: 100%; background: var(--md-primary); border-radius: 2px; }

function chart(add = 0) { return `<div class="chart-box" data-add="${add}"></div>`; }
function chartSvg(add, W) {
  const pts = [358, 362, 371, 406, 404, 396, 398, 389, 395, 384, 380, 384, 383, 418, 410, 412].map((v, i) => v + 10 + Math.round(add * (0.7 + i * 0.02)));
  const H = 220, pl = 44, pr = 12, pt = 12, pb = 28;
  const min = Math.floor((Math.min(...pts) - 15) / 10) * 10, max = Math.ceil((Math.max(...pts) + 10) / 10) * 10;
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (max - v) * (H - pt - pb) / (max - min);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length - 1)} ${H - pb} L${x(0)} ${H - pb} Z`;
  const ticks = [0, 1, 2].map(k => Math.round((min + 10 + k * (max - min - 20) / 2) / 10) * 10);
  const days = [[0, '01.11'], [5, '06.11'], [10, '11.11'], [15, '17.11']];
  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Залишок коштів з 1 по 17 листопада, від ${pts[0]} до ${pts[pts.length - 1]} тисяч гривень">
    ${ticks.map(t => `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${t}к</text>`).join('')}
    ${days.map(([i, l]) => `<text class="axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join('')}
    <path d="${area}" fill="#0B57D0" fill-opacity=".08"/>
    <path d="${line}" fill="none" stroke="#0B57D0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="5" fill="#0B57D0" stroke="#fff" stroke-width="2"/>
  </svg>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, tr[data-doc], [data-close]');
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.mode) { state.mode = t.dataset.mode; return render(); }
  if (t.hasAttribute('data-periodmenu')) { $('#periodMenu').hidden = !$('#periodMenu').hidden; return; }
  if (t.dataset.period) { state.period = t.dataset.period; return render(); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.doc) return openDoc(+t.dataset.doc);
  if (t.dataset.doctab) { state.docTab = t.dataset.doctab; return render(); }
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-dclose')) return hideDialog();
  if (t.dataset.sign) { const [n, p] = t.dataset.sign.split('|'); return openSign(n, p); }
  if (t.dataset.dsign) {
    const r = state.reports.find(x => x.name === t.dataset.dsign && x.st === 'ready');
    if (r) r.st = 'sent';
    hideDialog(); render(); return snack('Звіт підписано і надіслано. Квитанцію збережено');
  }
  if (t.hasAttribute('data-upload')) return openUpload();
  if (t.dataset.snack) return snack(t.dataset.snack);
  if (t.dataset.post) {
    const d = state.docs.find(x => x.id === +t.dataset.post); const prev = d.st;
    d.st = 'ok'; closeSheet(); render();
    return snack(`${d.type} № ${d.no} проведено`, () => { d.st = prev; render(); });
  }
  if (t.dataset.reject) {
    const i = state.docs.findIndex(x => x.id === +t.dataset.reject); const [d] = state.docs.splice(i, 1);
    closeSheet(); render();
    return snack('Документ відхилено', () => { state.docs.splice(i, 0, d); render(); });
  }
  if (t.dataset.answer) {
    const qi = state.questions.findIndex(q => q.id === t.dataset.answer); const q = state.questions[qi];
    t.setAttribute('aria-pressed', 'true');
    setTimeout(() => {
      state.questions.splice(qi, 1);
      const doc = q.doc && state.docs.find(d => d.id === q.doc); const prev = doc && doc.st;
      if (doc) doc.st = 'ok';
      const b = q.id === 'q2' && state.bank.find(x => x.kt === '?'); if (b) { b.kt = '361'; b.st = 'ok'; }
      render();
      snack(`Відповідь «${t.dataset.opt}» збережено, документ проведено`, () => {
        state.questions.splice(qi, 0, q); if (doc) doc.st = prev; if (b) { b.kt = '?'; b.st = 'check'; } render();
      });
    }, 250);
    return;
  }
  if (t.classList.contains('chip') && !t.dataset.answer) {
    t.parentElement.querySelectorAll('.chip').forEach(c => { c.setAttribute('aria-pressed', c === t); c.querySelector('.ms') && c.querySelector('.ms').remove(); });
    t.insertAdjacentHTML('afterbegin', '<span class="ms">check</span>');
    return;
  }
});

function understand(text) {
  const n = (text.match(/\d[\d\s]*(?:[.,]\d+)?/) || [''])[0].replace(/\s/g, '');
  const sum = n ? Number(n.replace(',', '.')) * (/тисяч|тис\b|к\b/i.test(text) && Number(n) < 1000 ? 1000 : 1) : 0;
  const t = text.toLowerCase();
  if (/скільки|який|яка|покажи/.test(t)) return 'За листопад: виручка 612 400 ₴, операційний прибуток 84 300 ₴, маржа 13,8%. Найприбутковіша точка «Поділ».';
  if (/оренд/.test(t)) return `Знайшов у виписці ПриватБанку платіж ${sum ? fmt(sum) : '28 000,00'} ₴ орендодавцю. Провів як оренду точки «Поділ». Акт ще не надійшов, попрошу його через Вчасно.`;
  if (/зарплат|аванс/.test(t)) return `Записав виплату ${sum ? fmt(sum) + ' ₴ ' : ''}як аванс по зарплаті. ПДФО і військовий збір нарахую при остаточному розрахунку.`;
  if (sum) return `Записав витрату ${fmt(sum)} ₴. Стаття «Інші витрати». Якщо це щось конкретне, напишіть як є, і я виправлю.`;
  return 'Зрозумів, записав як нотатку до сьогоднішнього дня. Якщо це витрата чи надходження, напишіть суму.';
}

$('#onbBack').addEventListener('click', () => { if (ob.step) { ob.step--; onbRender(); } });
$('#onbClose').addEventListener('click', () => { $('#onb').hidden = true; });
$('#onb').addEventListener('click', e => {
  const t = e.target.closest('[data-biz],[data-form],[data-cnt],[data-add],[data-del],[data-msel],[data-ssel]');
  if (!t) return;
  if (t.dataset.add) { const [n, m] = ADD_DEFAULT[t.dataset.add]; ob[t.dataset.add].push({ n: n + (ob[t.dataset.add].length + 1 > 1 ? ' ' + (ob[t.dataset.add].length + 1) : ''), m }); }
  if (t.dataset.del) { const [k, i] = t.dataset.del.split('|'); ob[k].splice(+i, 1); }
  if (t.dataset.msel) { const [k, v] = t.dataset.msel.split('|'); ob[k] = ob[k].includes(v) ? ob[k].filter(x => x !== v) : [...ob[k], v]; }
  if (t.dataset.ssel) { const [k, v] = t.dataset.ssel.split('|'); ob[k] = v; }
  if (t.dataset.biz) ob.type = t.dataset.biz;
  if (t.dataset.form) ob.form = t.dataset.form;
  if (t.dataset.cnt) { const [k, d] = t.dataset.cnt.split('|'); ob[k] = Math.max(0, Math.min(999, ob[k] + +d)); }
  onbRender();
});
$('#onb').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.tog) ob[t.dataset.tog] = t.checked;
  if (t.dataset.field) ob[t.dataset.field] = t.value;
  if (t.dataset.conn) { ob.conns[t.dataset.conn] = t.checked; const c = $('#connOn'); if (c) c.textContent = 'Обрано: ' + Object.keys(ob.conns).filter(k => ob.conns[k]).length; }
});
$('#onb').addEventListener('input', e => {
  if (e.target.id !== 'connQ') return;
  const q = e.target.value.trim().toLowerCase(); let any = false;
  document.querySelectorAll('.conn-group').forEach(g => {
    let vis = 0;
    g.querySelectorAll('.set-row').forEach(r => { const m = !q || r.dataset.name.includes(q); r.hidden = !m; if (m) vis++; });
    g.hidden = !vis; if (vis) any = true;
  });
  $('#connEmpty').hidden = any;
});
